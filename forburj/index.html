<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Something For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <!-- PAGE 1: PASSWORD SCREEN -->
  <main id="lock-screen" class="screen">
    <div class="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-front"></div>
        <div class="wax-seal">
          <svg viewBox="0 0 60 60" width="34" height="34" aria-hidden="true">
            <path d="M30 6 C36 6 36 16 30 16 C24 16 24 6 30 6 Z M30 44 C36 44 36 54 30 54 C24 54 24 44 30 44 Z M6 30 C6 24 16 24 16 30 C16 36 6 36 6 30 Z M44 30 C44 24 54 24 54 30 C54 36 44 36 44 30 Z" fill="currentColor"/>
            <circle cx="30" cy="30" r="11" fill="currentColor"/>
          </svg>
        </div>
      </div>
    </div>

    <h1 class="title">A Little Something For You <span class="heart">❤</span></h1>
    <p class="subtitle">There's something waiting for you&hellip;</p>

    <form id="unlock-form" class="unlock-form" autocomplete="off">
      <label for="password-input" class="sr-only">Enter the password</label>
      <input
        type="text"
        inputmode="numeric"
        id="password-input"
        class="password-input"
        placeholder="Enter the password"
        aria-describedby="hint-text"
      >
      <button type="submit" class="unlock-btn">Unlock <span aria-hidden="true">❤</span></button>
    </form>

    <p class="hint" id="hint-text">Hint: A special date, written in numbers. ❤</p>
    <p class="error-msg" id="error-msg" role="alert" aria-live="polite">Hmm&hellip; that's not it, my Burj. Try again ❤</p>
  </main>

  <!-- PAGE 2: LETTER -->
  <main id="letter-screen" class="screen letter-screen" hidden>
    <div class="letter-card">
      <p class="letter-kicker">for my Burj</p>
      <h2 class="letter-title">Congratulations to you, my Burj! <span class="heart">❤</span></h2>

      <div class="letter-body" id="letter-body" aria-live="polite"></div>

      <p class="letter-signoff">Always cheering for you. <span class="heart">❤</span></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
